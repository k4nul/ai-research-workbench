name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: research_workbench
          POSTGRES_USER: research
          POSTGRES_PASSWORD: research
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U research -d research_workbench"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://research:research@localhost:5432/research_workbench
      TEST_DATABASE_URL: postgresql://research:research@localhost:5432/research_workbench_test
      DEMO_MODE: "true"
      APP_URL: http://127.0.0.1:3100
      STORAGE_DIR: ./.data
      CI: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run db:migrate
      - run: npm run seed
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-artifacts
          path: |
            playwright-report
            test-results
          retention-days: 7
